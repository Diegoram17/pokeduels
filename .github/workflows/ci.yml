name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (build, test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  backend:
    name: Backend (test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

      # 266 of the backend's tests are NOT DB-gated: they run unconditionally on
      # every PR with no DATABASE_URL and can fail the job. The remaining 162 are
      # DB-gated (skipped when DATABASE_URL is absent) and only run inside the
      # secret-gated Neon block below.
      - name: Run non-gated backend tests (no DATABASE_URL)
        run: npm test

      # Check if Neon secrets are available before attempting to create a branch.
      # This step always runs and sets an output that downstream steps use.
      - name: Check if Neon secrets are available
        id: check_neon
        run: |
          if [ -n "$NEON_PROJECT_ID" ] && [ -n "$NEON_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      # DB-gated block — runs only when Neon secrets are provisioned. When they
      # are absent this whole block is skipped VISIBLY (see the always-run
      # summary step), never silently reported as passing.
      - name: Create ephemeral Neon branch for this run
        id: neon_branch
        if: steps.check_neon.outputs.available == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}

      - name: Run migrations against the ephemeral branch
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: node ./node_modules/node-pg-migrate/bin/node-pg-migrate.js up

      - name: Seed catalog data
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: node seed/index.js

      - name: Run DB-gated backend tests (162 tests, requires DATABASE_URL)
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: npm test

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon_branch.outputs.db_url
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}

      # Always-run summary so DB-gated skips are never silently green: every PR
      # reports on the PR itself whether the 162 DB-gated tests ran or were
      # skipped for lack of secrets.
      - name: Report DB-gated test status to job summary
        if: always()
        run: |
          echo "## Backend test summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEON_AVAILABLE" = "true" ]; then
            echo "- 266 non-gated tests ran." >> "$GITHUB_STEP_SUMMARY"
            echo "- 162 DB-gated tests ran against an ephemeral Neon branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 266 non-gated tests ran." >> "$GITHUB_STEP_SUMMARY"
            echo "- 162 DB-gated tests SKIPPED: NEON_PROJECT_ID / NEON_API_KEY secrets are not configured. This is a skip, not a pass - a regression in those tests would surface once secrets are provisioned." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NEON_AVAILABLE: ${{ steps.check_neon.outputs.available }}
