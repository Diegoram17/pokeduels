name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel redundant runs: if a new push arrives while a previous run is still
# in progress for the same branch/PR, cancel the older one. This saves CI
# minutes and ensures the latest code is what gets validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build, test, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  backend:
    name: Backend (test, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 275 of the backend's tests are NOT DB-gated: they run unconditionally on
      # every PR with no DATABASE_URL and can fail the job. The remaining 164 are
      # DB-gated (skipped when DATABASE_URL is absent) and only run inside the
      # secret-gated Neon block below.
      - name: Run non-gated backend tests (no DATABASE_URL)
        run: npm test

      # Check if Neon secrets are available before attempting to create a branch.
      # This step always runs and sets an output that downstream steps use.
      - name: Check if Neon secrets are available
        id: check_neon
        run: |
          if [ -n "$NEON_PROJECT_ID" ] && [ -n "$NEON_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      # DB-gated block — runs only when Neon secrets are provisioned. When they
      # are absent this whole block is skipped VISIBLY (see the always-run
      # summary step), never silently reported as passing.
      - name: Create ephemeral Neon branch for this run
        id: neon_branch
        if: steps.check_neon.outputs.available == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}

      - name: Run migrations against the ephemeral branch
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: |
          # A freshly created Neon branch can reject the first connections with
          # "Control plane request failed" (XX000) while its compute spins up.
          # Retry with backoff instead of failing the job on a transient error.
          for attempt in 1 2 3 4 5; do
            if node ./node_modules/node-pg-migrate/bin/node-pg-migrate.js up; then
              echo "Migrations applied on attempt $attempt"
              exit 0
            fi
            echo "migration attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Seed catalog data
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: node seed/index.js

      - name: Run DB-gated backend tests (164 tests, requires DATABASE_URL)
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: npm test

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon_branch.outputs.db_url
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}

      # Always-run summary so DB-gated skips are never silently green: every PR
      # reports on the PR itself whether the 164 DB-gated tests ran or were
      # skipped for lack of secrets.
      - name: Report DB-gated test status to job summary
        if: always()
        run: |
          echo "## Backend test summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEON_AVAILABLE" = "true" ]; then
            echo "- 275 non-gated tests ran." >> "$GITHUB_STEP_SUMMARY"
            echo "- 164 DB-gated tests ran against an ephemeral Neon branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 275 non-gated tests ran." >> "$GITHUB_STEP_SUMMARY"
            echo "- 164 DB-gated tests SKIPPED: NEON_PROJECT_ID / NEON_API_KEY secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
            echo "  To enable: add these secrets at Repository Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NEON_AVAILABLE: ${{ steps.check_neon.outputs.available }}
