name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (build, test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  backend:
    name: Backend (test, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

      # 162 of the backend's tests are DB-gated (skipped without DATABASE_URL).
      # When NEON_PROJECT_ID + NEON_API_KEY secrets are set, an ephemeral Neon
      # branch gives this run a real, isolated Postgres so the full suite runs.
      # Without those secrets, only the 266 non-gated tests run (still valid).
      - name: Check if Neon secrets are available
        id: check_neon
        run: |
          if [ -n "$NEON_PROJECT_ID" ] && [ -n "$NEON_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Create ephemeral Neon branch for this run
        id: neon_branch
        if: steps.check_neon.outputs.available == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}

      - name: Run migrations against the ephemeral branch
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: node ./node_modules/node-pg-migrate/bin/node-pg-migrate.js up

      - name: Seed catalog data
        if: steps.neon_branch.outputs.db_url
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: node seed/index.js

      - name: Run backend test suite (DB-gated tests included when Neon available)
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
        run: npm test

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon_branch.outputs.db_url
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}
