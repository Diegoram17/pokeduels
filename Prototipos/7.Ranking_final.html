<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Final · Poke-duels</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<style>
  .rank-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    padding:0 var(--pd-space-6);height:64px;background:rgba(5,8,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--pd-border-blue-dim)}
  .rank-topbar-right{display:flex;align-items:center;gap:var(--pd-space-3)}
  .rank-main{position:relative;min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:48px var(--pd-space-6);overflow:hidden}
  .rank-intro{text-align:center;z-index:20;margin-bottom:var(--pd-space-6);max-width:560px}
  .rank-eyebrow{display:inline-block;padding:var(--pd-space-1) var(--pd-space-3);border-radius:var(--pd-radius-sm);
    background:rgba(255,203,5,.1);border:1px solid rgba(255,203,5,.35);margin-bottom:var(--pd-space-3)}
  .particle{position:absolute;border-radius:50%;background:var(--pd-blue-light);
    box-shadow:0 0 10px var(--pd-blue-light),0 0 20px var(--pd-blue-light);animation:float-up linear infinite;opacity:0}
  @keyframes float-up{0%{transform:translateY(100px) scale(0);opacity:0}20%{opacity:1;transform:translateY(80px) scale(1)}
    80%{opacity:.8;transform:translateY(-50px) scale(.8)}100%{transform:translateY(-100px) scale(0);opacity:0}}
  @media (prefers-reduced-motion: reduce){.particle{animation:none;display:none}}

  .podium{position:relative;z-index:20;display:flex;align-items:flex-end;justify-content:center;gap:var(--pd-space-4);
    width:100%;max-width:1000px;flex-wrap:wrap}
  .podium-col{display:flex;flex-direction:column;align-items:center;width:280px;max-width:100%}
  .podium-col--first{width:320px;transform:translateY(-24px)}
  .podium-card{width:100%;border-radius:var(--pd-radius-md) var(--pd-radius-md) 0 0;border-bottom:none;padding:var(--pd-space-4);display:flex;flex-direction:column;
    align-items:center;text-align:center;position:relative}
  .rank-chip{position:absolute;top:-14px;padding:var(--pd-space-1) var(--pd-space-3);border-radius:var(--pd-radius-sm);font:700 16px/1 var(--pd-font-mono)}
  .podium-avatar{border-radius:50%;overflow:hidden;margin-bottom:var(--pd-space-3);margin-top:var(--pd-space-4)}
  .podium-avatar img{width:100%;height:100%;object-fit:cover}
  .podium-name{margin:0 0 var(--pd-space-1);font:800 18px/1.2 var(--pd-font-display);color:#fff;text-transform:uppercase}
  .podium-rank-label{font-family:var(--pd-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--pd-space-3)}
  .stat-row{width:100%;display:flex;justify-content:space-between;padding:var(--pd-space-2) var(--pd-space-3);border-radius:var(--pd-radius-sm);
    background:rgba(9,16,40,.5);border:1px solid var(--pd-border-blue-dim);margin-top:auto}
  .stat-item{display:flex;flex-direction:column;align-items:center;gap:2px}
  .podium-base{width:100%;border-left:1px solid var(--pd-border-blue-dim);border-right:1px solid var(--pd-border-blue-dim);
    border-top:1px solid var(--pd-border-blue-dim)}
  .podium-base--2,.podium-base--3{height:110px;background:linear-gradient(180deg, rgba(20,30,60,.6), rgba(9,16,40,.4))}
  .podium-base--1{height:160px;background:linear-gradient(180deg, rgba(255,203,5,.14), rgba(9,16,40,.4));border-color:rgba(255,203,5,.4)}
  .champion-badge{display:inline-block;padding:var(--pd-space-1) var(--pd-space-2);border-radius:var(--pd-radius-sm);margin-bottom:var(--pd-space-2);
    background:rgba(255,203,5,.14);color:var(--pd-yellow);border:1px solid rgba(255,203,5,.4);
    font:700 11px/1 var(--pd-font-mono);letter-spacing:.12em;text-transform:uppercase}
</style>
</head>

<script>
  // Simple ambient particle generator (vanilla JS, preserved from the original prototype).
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var container = document.getElementById('particle-container');
    var particleCount = 30;

    function createParticle() {
      var particle = document.createElement('div');
      particle.classList.add('particle');

      var size = Math.random() * 6 + 2;
      var left = Math.random() * 100;
      var bottom = Math.random() * 20;
      var duration = Math.random() * 3 + 2;
      var delay = Math.random() * 2;

      if (Math.random() > 0.7) {
        particle.style.background = '#ffcb05';
        particle.style.boxShadow = '0 0 10px #ffcb05, 0 0 20px #ffcb05';
      }

      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = left + '%';
      particle.style.bottom = bottom + '%';
      particle.style.animationDuration = duration + 's';
      particle.style.animationDelay = delay + 's';

      container.appendChild(particle);

      particle.addEventListener('animationend', function () {
        particle.remove();
        createParticle();
      });
    }

    for (var i = 0; i < particleCount; i++) createParticle();
  })();
</script>
<script>
(function(){
  var name = localStorage.getItem('pd_nickname') || 'ENTRENADOR';
  var els = document.querySelectorAll('[data-pd-nickname]');
  for (var i = 0; i < els.length; i++) els[i].textContent = name;

</script>
